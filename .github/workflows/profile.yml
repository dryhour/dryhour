name: Refresh profile panel

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-panel
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Fails if any card provider errors, leaving the committed panel untouched.
      - run: python scripts/build_profile.py
      - name: Commit refreshed panel
        run: |
          git add profile.svg assets/profile
          if git diff --cached --quiet; then
            echo 'Panel unchanged; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh profile panel'
          git push
